<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <div class="card-component">
      <img
        src="./blog-preview-card-main/assets/images/illustration-article.svg"
        alt="drawers"
        class="card-image"
      />
      <div class="card-content">
        <div class="card-category">Learning</div>
        <div class="card-date">Published 21 Dec 2023</div>
        <h1 class="card-title">HTML & CSS foundations</h1>
        <p class="card-description">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
        <div class="author-component">
          <img
            src="./blog-preview-card-main/assets/images/image-avatar.webp"
            alt="Michelle"
            class="card-component-avatar"
            width="32"
          />
          <span class="card-author">Greg Hooper</span>
        </div>
      </div>
    </div>
  </body>
</html>
